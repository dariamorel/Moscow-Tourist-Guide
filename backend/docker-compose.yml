version: "3.8"

services:
  app:
    build: .
    container_name: tour-guide
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    cap_add:
      - SYS_PTRACE
      - IPC_LOCK

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - ./postgresql/schemas/ddl.sql:/docker-entrypoint-initdb.d/schemas/ddl.sql