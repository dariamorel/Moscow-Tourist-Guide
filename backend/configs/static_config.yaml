components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
    fs-task-processor:
      worker_threads: 4
  default_task_processor: main-task-processor

  components:
    server:
      listener:
        port: 8000
        task_processor: main-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: debug
          overflow_behavior: discard

    handler-get-sight:
      path: /sights/{sightId}
      method: GET
      task_processor: main-task-processor

    postgres-db-1:
      dbconnection: \$db_connection
      blocking_task_processor: fs-task-processor
