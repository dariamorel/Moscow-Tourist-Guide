openapi: 3.0.3
info:
  title: Tour Guide API
  version: 1.0.0
  description: API для работы с достопримечательностями, маршрутами и пользователями.

servers:
  - url: http://localhost:8000
    description: Локальный сервер

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Sight:
      type: object
      required: [id, img, lat, lon, short_desc, desc]
      properties:
        id:
          type: integer
        img:
          type: string
          format: uri
        lat:
          type: number
          format: double
          example: 55.751244
        lon:
          type: number
          format: double
          example: 37.618423
        tags:
          type: array
          items:
            type: string
          example: ["музей", "история"]
        short_desc:
          type: string
        desc:
          type: string
        timetable:
          type: string
        addr:
          type: string
        phone:
          type: string
        subway:
          type: string

    Route:
      type: object
      required: [id, user_id, date]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        order:
          type: array
          description: "Пройденные достопримечательности (по порядку)"
          items:
            type: integer
          example: [1, 3]
        planned_order:
          type: array
          description: "Полный запланированный маршрут"
          items:
            $ref: '#/components/schemas/Sight'
          example: []
        total_time:
          type: string
          example: "2h 30m"
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [planned, in_progress, completed, declined]
          example: "in_progress"

    RouteInput:
      type: object
      required: [user_id, planned_order]
      properties:
        user_id:
          type: integer
        planned_order:
          type: array
          items:
            type: integer
          minItems: 1
          description: "Порядок обхода достопримечательностей"
        total_time:
          type: string

    RouteUpdateInput:
      type: object
      description: "Данные для обновления маршрута"
      properties:
        order:
          type: array
          description: "Пройденные достопримечательности (по порядку)"
          items:
            type: integer
          example: [1, 3]
        planned_order:
          type: array
          description: "Полный запланированный маршрут (если нужно изменить)"
          items:
            type: integer
          example: [1, 2, 3, 4, 5]
        total_time:
          type: string
          example: "2h 30m"
        status:
          type: string
          enum: [planned, in_progress, completed, declined]
          example: "in_progress"
      
    OptimizeRouteInput:
      type: object
      required: [sight_ids]
      properties:
        sight_ids:
          type: array
          items:
            type: integer
          minItems: 2
          description: "Список ID достопримечательностей. Первый и последний — фиксированные, остальные будут переупорядочены."
          example: [1, 2, 3, 4, 5]

    OptimizeRouteResponse:
      type: object
      required: [optimized_order, total_time]
      properties:
        optimized_order:
          type: array
          description: "Оптимизированный порядок достопримечательностей"
          items:
            $ref: '#/components/schemas/Sight'
        total_time:
          type: string
          description: "Общее время в пути в формате"
          example: "2h 30m"

    User:
      type: object
      properties:
        id:
          type: integer
        login:
          type: string
        created_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_-]+$'
        password:
          type: string
          minLength: 8
          maxLength: 100
          format: password

    Achievement:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [sights_visited, routes_completed, tag_collector]
        name:
          type: string
        description:
          type: string
        icon_url:
          type: string
          format: uri
        required_count:
          type: integer
        tag:
          type: string
          nullable: true
        progress:
          type: integer
          description: "Текущий прогресс пользователя"
          default: 0

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Достопримечательность не найдена"
        details:
          type: object
          additionalProperties: true

paths:
  /sights/{sightId}:
    get:
      summary: Получить достопримечательность по ID
      tags: [Sights]
      parameters:
        - name: sightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sight'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sights:
    get:
      summary: Получить список достопримечательностей
      tags: [Sights]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: tag
          in: query
          schema:
            type: string
          description: "Фильтр по тегу"
      responses:
        '200':
          description: Список достопримечательностей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sight'

  /routes:
    get:
      summary: Получить маршруты пользователя
      tags: [Routes]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [planned, in_progress, completed, declined]
          description: "Фильтр по статусу"
      responses:
        '200':
          description: Список маршрутов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать новый маршрут
      tags: [Routes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
      responses:
        '201':
          description: Маршрут создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /routes/passed:
    get:
      summary: Получить завершённые маршруты
      tags: [Routes]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список маршрутов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'

  /routes/declined:
    get:
      summary: Получить отклонённые маршруты
      tags: [Routes]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список маршрутов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'

  /routes/in_progress:
    get:
      summary: Получить маршруты в процессе
      tags: [Routes]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список маршрутов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'

  /routes/{routeId}:
    put:
      summary: Обновить маршрут
      tags: [Routes]
      security:
        - BearerAuth: []
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpdateInput'
      responses:
        '200':
          description: Маршрут обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          description: Маршрут не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить маршрут
      tags: [Routes]
      security:
        - BearerAuth: []
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Удалено
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /routes/optimize:
    post:
      summary: Оптимизировать порядок достопримечательностей в маршруте
      description: |
        Принимает список ID достопримечательностей. Первая и последняя точки остаются на своих местах,
        промежуточные переупорядочиваются для минимизации общего времени в пути.
      tags: [Routes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeRouteInput'
      responses:
        '200':
          description: Маршрут оптимизирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizeRouteResponse'
        '400':
          description: Некорректный запрос (меньше 2 или больше 19 точек)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Одна или несколько достопримечательностей не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/registration:
    post:
      summary: Регистрация пользователя
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Логин занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/login:
    post:
      summary: Авторизация пользователя
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: "JWT токен"
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /achievements:
    get:
      summary: Получить все достижения
      tags: [Achievements]
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Список достижений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Achievement'

  /achievements/completed:
    get:
      summary: Получить завершённые достижения пользователя
      tags: [Achievements]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список завершённых достижений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Achievement'